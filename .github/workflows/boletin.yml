name: Boletín de empleos

# Arranca en VISTA PREVIA: genera el boletín y lo publica como archivo
# descargable en la corrida, sin enviar correo y sin tocar el historial.
# Para pasar a envío real, cuando TI entregue las credenciales:
#   1. Cargar los secretos SMTP_HOST, SMTP_USUARIO y SMTP_CLAVE.
#   2. Crear la variable ENVIO_REAL con el valor true
#      (Settings -> Secrets and variables -> Actions -> Variables).
# No hay que tocar este archivo.

on:
  schedule:
    # Quincenal: días 1 y 15 de cada mes, 12:00 UTC (07:00 en Colombia).
    - cron: "0 12 1,15 * *"
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar el correo de verdad (exige los secretos SMTP)"
        type: boolean
        default: false

# Necesario para guardar el historial tras un envío real. En vista previa no se
# commitea nada. Exige además Settings -> Actions -> General -> Workflow
# permissions -> Read and write permissions.
permissions:
  contents: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    # Una corrida completa tarda unos 10 minutos: el Servicio Público de Empleo
    # se pagina de a 83 páginas y después se comprueba cada enlace.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Decidir el modo de esta corrida
        id: modo
        env:
          ENVIO_REAL: ${{ vars.ENVIO_REAL }}
          PEDIDO_MANUAL: ${{ inputs.enviar }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            solicitado="$PEDIDO_MANUAL"
          else
            solicitado="$ENVIO_REAL"
          fi

          if [ "$solicitado" = "true" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Modo envío real: el boletín se manda a los destinatarios de config.toml."
          else
            echo "enviar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Modo vista previa: el boletín queda como archivo descargable al final de esta corrida. No se envía correo ni se modifica el historial."
          fi

      - name: Generar el boletín
        id: generar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENVIAR: ${{ steps.modo.outputs.enviar }}
        run: |
          set +e
          if [ "$ENVIAR" = "true" ]; then
            uv run boletin --verboso
          else
            uv run boletin --dry-run --verboso --salida datos/vista-previa
          fi
          codigo=$?
          set -e

          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          case "$codigo" in
            0) ;;
            3) echo "::warning::No hubo vacantes nuevas para esta edición; no se generó boletín." ;;
            2) echo "::error::Ningún portal respondió. No se envía un boletín vacío."; exit 2 ;;
            *) echo "::error::La corrida falló con código $codigo. Revisa el registro de este paso."; exit "$codigo" ;;
          esac

      - name: Publicar el boletín como archivo descargable
        if: always() && steps.modo.outputs.enviar != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: boletin-${{ github.run_number }}
          path: datos/vista-previa/*.html
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar el historial y la edición
        if: steps.modo.outputs.enviar == 'true' && steps.generar.outputs.codigo == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "chore: edición del $(date +%F)"
          git push
