name: Boletín de empleos

# Arranca en VISTA PREVIA: genera el boletín, publica la edición en el sitio y la
# deja como archivo descargable de la corrida, sin enviar correo y sin tocar el
# historial.
# Para pasar a envío real, cuando TI entregue las credenciales:
#   1. Cargar los secretos SMTP_HOST, SMTP_USUARIO y SMTP_CLAVE.
#   2. Crear la variable ENVIO_REAL con el valor true
#      (Settings -> Secrets and variables -> Actions -> Variables).
# No hay que tocar este archivo.

on:
  schedule:
    # Quincenal: días 1 y 15 de cada mes, 12:00 UTC (07:00 en Colombia).
    - cron: "0 12 1,15 * *"
  workflow_dispatch:
    inputs:
      enviar:
        description: "Enviar el correo de verdad (exige los secretos SMTP)"
        type: boolean
        default: false

permissions:
  # contents: guardar la edición y el historial en el repositorio.
  # pages e id-token: publicar el sitio con las ediciones.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: boletin
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    # Cada carrera tarda unos cinco minutos: el Servicio Público de Empleo se
    # pagina de a decenas de páginas y después se comprueba cada enlace.
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: Decidir el modo de esta corrida
        id: modo
        env:
          ENVIO_REAL: ${{ vars.ENVIO_REAL }}
          PEDIDO_MANUAL: ${{ inputs.enviar }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            solicitado="$PEDIDO_MANUAL"
          else
            solicitado="$ENVIO_REAL"
          fi

          if [ "$solicitado" = "true" ]; then
            echo "enviar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Modo envío real: el correo se manda a los destinatarios de config.toml."
          else
            echo "enviar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Modo vista previa: la edición se publica en el sitio, pero no se envía correo ni se modifica el historial."
          fi

      - name: Generar los boletines
        id: generar
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PUERTO: ${{ secrets.SMTP_PUERTO }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ENVIAR: ${{ steps.modo.outputs.enviar }}
        run: |
          # Una edición por carrera. Si una falla, las demás siguen: al final se
          # decide si la corrida entera queda en rojo.
          peor=0
          for archivo in programas/*.toml; do
            clave=$(basename "$archivo" .toml)
            if [ "$clave" = "comun" ]; then continue; fi

            echo "::group::$clave"
            set +e
            if [ "$ENVIAR" = "true" ]; then
              uv run boletin --programa "$clave" --verboso
            else
              uv run boletin --programa "$clave" --dry-run --verboso
            fi
            codigo=$?
            set -e
            echo "::endgroup::"

            case "$codigo" in
              0) echo "::notice::$clave: edición generada." ;;
              3) echo "::warning::$clave: no hubo vacantes nuevas para esta edición." ;;
              2) echo "::error::$clave: ningún portal respondió."; peor=2 ;;
              *) echo "::error::$clave: falló con código $codigo."; peor=$codigo ;;
            esac
          done
          echo "codigo=$peor" >> "$GITHUB_OUTPUT"

      - name: Publicar las ediciones como archivo descargable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: boletin-${{ github.run_number }}
          path: datos/*/ediciones/*.html
          if-no-files-found: ignore
          retention-days: 90

      - name: Guardar la edición en el repositorio
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --staged --quiet || git commit -m "chore: edición del $(date +%F)"
          git push

      - name: Construir el sitio de ediciones
        if: ${{ !cancelled() }}
        run: uv run python -m boletin_empleos.sitio

      - name: Preparar GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - name: Desplegar el sitio
        id: despliegue
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      - name: Dejar la corrida en rojo si alguna carrera falló
        if: steps.generar.outputs.codigo != '0'
        run: |
          echo "::error::Alguna carrera terminó con código ${{ steps.generar.outputs.codigo }}."
          exit 1
