# Edición del boletín semestral "Proyección Social EN ACCIÓN".
# Llena cada sección con lo que manda la Coordinación y borra su línea `pendiente`
# cuando esté completa. La palabra entre asteriscos de un título sale en letra
# manuscrita roja. Instrucciones completas: docs/manual-boletin-semestral.md

volumen = {volumen}
semestre = "{semestre}"
fecha = "{fecha}"
estado = "borrador"

[portada]
titular = ""
# foto = "portada.jpg"

[editorial]
titulo = "Construyendo *impacto* desde la academia"
cuerpo = ""
firma = "Coordinación de Proyección Social"

[[secciones]]
tipo = "cifras"
etiqueta = "Cifras"
titulo = "Proyección social en *cifras*"
pendiente = "Faltan las cifras del semestre (personas sensibilizadas, emprendedores, participantes). Pedir a: Coordinación de Proyección Social."

[[secciones]]
tipo = "proyectos"
etiqueta = "Comunidades"
