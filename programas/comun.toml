# Lo que comparten TODAS las carreras: umbrales, pesos, heurísticas antiestafa,
# geografía y estrategia de descarga.
#
# Cada carrera vive en su propio archivo (software.toml, industrial.toml) y
# empieza con `extiende = "comun.toml"`. Lo que el programa define manda sobre
# esto, y una lista del programa reemplaza la de aquí en vez de sumarse.

umbral_relevancia = 0.35
dias_max_antiguedad = 30
max_meses_experiencia = 60      # 5 años: por encima se considera senior
excluir_practicas = true        # la audiencia son egresados, no practicantes

[sitio]
# Raíz del sitio publicado. Cada carrera cuelga de aquí con su clave:
# .../software y .../industrial.
url_base = "https://jsua3.github.io/proy_social_proyectos"
vacantes_en_correo = 10

[fuentes]
# Qué portales se consultan. Cada carrera puede recortar la lista en su archivo.
# "keyrus" es el portal propio de una consultora de datos, recomendado por la
# profesora el 24/09/2026: pocas vacantes, pero publicadas por quien contrata.
usar = ["spe", "magneto", "remotive", "remoteok", "keyrus"]

# Consultas que sirven para cualquier carrera: remoto nacional y los tres
# departamentos del eje cafetero enteros. Los cargos propios van en `cargos_spe`
# de cada programa. El nombre del departamento va SIN tilde: la API del SPE
# devuelve cero resultados con "Quindío".
consultas_spe = [
  { teletrabajo = "1" },
  { departamento = "Quindio" },
  { departamento = "Risaralda" },
  { departamento = "Caldas" },
]

# `/co/trabajos/ofertas-empleo-en-armenia` y la de trabajo remoto devuelven
# HTTP 500 desde el servidor de Magneto. Comprobado el 20/09/2026.
rutas_magneto = [
  "/co/trabajos/buscar",
  "/co/trabajos/ofertas-empleo-en-bogota",
  "/co/trabajos/ofertas-empleo-en-medellin",
  "/co/trabajos/ofertas-empleo-en-pereira",
  "/co/trabajos/ofertas-empleo-en-manizales",
]

[relevancia]
# Cómo se pondera una coincidencia. Estos números deciden si una oferta supera
# `umbral_relevancia`, así que viven aquí y no incrustados en Python: afinar el
# filtro no debe exigir saber programar.
peso_titulo = 0.7           # una coincidencia en el título vale mucho más
peso_descripcion = 0.3      # que una en la descripción
saturacion_base = 0.6       # lo que aporta la PRIMERA coincidencia
saturacion_incremento = 0.2 # lo que aporta cada coincidencia adicional

[experiencia]
# Descartan por exigir un nivel de experiencia demasiado alto.
# Son datos, no símbolos: coinciden con el texto real de las ofertas.
#
# "principal" a secas NO está en la lista a propósito: en español colombiano
# significa casi siempre "sede principal" o "cajero principal", y descartaría un
# "Desarrollador - Sede Principal" como si fuera senior. Se usan en su lugar las
# formas inglesas inequívocas, que son las que aparecen en las fuentes remotas.
terminos_excluidos = [
  "senior", "sr", "lead", "lider tecnico", "líder técnico", "arquitecto jefe",
  "jefe de", "gerente", "director", "head of", "staff engineer",
  "principal engineer", "principal software", "principal developer",
  "coordinador de desarrollo",
  # Plurales ingleses: la regla morfológica es española y no flexiona `-er`,
  # porque ahí viven `docker`, `tester` y `flutter`. Se cubren como dato.
  "staff engineers", "principal engineers", "principal developers",
  # Del primer boletín real (14/09/2026): "sr." pasó a "sr" (la frontera de
  # palabra ya cubre "Sr" y "Sr." sin el punto, y sin casar dentro de
  # "Sres."); "principal data" y "experto" se añaden porque "principal
  # engineer/software/developer" no cubría "Principal Data Engineer" ni
  # "Desarrollador Experto de Sistemas de Información".
  "principal data", "experto",
]

[legitimidad]
min_caracteres_descripcion = 200
salario_minimo_legal = 1_623_500          # SMLV Colombia 2026
salario_maximo_razonable = 25_000_000     # tope para perfil junior/semi-senior

# Descarte inmediato.
frases_descarte = [
  "inversion inicial", "inversión inicial", "pago de inscripcion",
  "pago de inscripción", "debes pagar", "kit de trabajo", "compra tu kit",
  "pago de tramites", "pago de trámites", "curso obligatorio con costo",
]
# Penalización fuerte.
frases_sospechosas = [
  "altos ingresos", "ingresos ilimitados", "gana desde casa",
  "sin experiencia gana", "cupos limitados", "ganancias inmediatas",
  "independencia financiera", "solo por whatsapp", "escribe al whatsapp",
]
dominios_sospechosos = ["bit.ly", "tinyurl.com", "cutt.ly", "acortar.link", "t.me"]

[geografia]
# Qué es "cerca" para una institución de Armenia. Esto SOLO ordena el boletín:
# las vacantes del eje cafetero van primero y nunca se descarta a nadie por
# estar lejos. Vaciar estas listas devuelve el boletín al trato parejo.
departamentos = ["quindio", "risaralda", "caldas"]

# Municipios del eje, por si la vacante no nombra el departamento. Tomados de
# los que el propio SPE reporta con vacantes (consultado el 20/09/2026).
municipios = [
  # Quindío
  "armenia", "calarca", "la tebaida", "montenegro", "circasia", "quimbaya",
  "filandia", "salento", "pijao", "buenavista",
  # Risaralda
  "pereira", "dosquebradas", "santa rosa de cabal", "la virginia", "marsella",
  "belen de umbria", "quinchia", "apia", "guatica", "santuario",
  # Caldas
  "manizales", "villamaria", "chinchina", "la dorada", "riosucio", "anserma",
  "neira", "supia", "marmato", "viterbo", "salamina", "aguadas", "pensilvania",
]

# Si la ubicación nombra uno de estos, la vacante es de allá. Hace falta porque
# los nombres chocan en los dos sentidos: Antioquia tiene su propio Armenia y su
# propio Caldas, y el Quindío tiene un municipio llamado Córdoba. Manda el
# último departamento nombrado, que es como el SPE escribe la ubicación.
otros_departamentos = [
  "amazonas", "antioquia", "arauca", "atlantico", "bogota", "bolivar", "boyaca",
  "caqueta", "casanare", "cauca", "cesar", "choco", "cordoba", "cundinamarca",
  "guainia", "guaviare", "huila", "la guajira", "magdalena", "meta", "narino",
  "norte de santander", "putumayo", "san andres", "santander", "sucre",
  "tolima", "valle del cauca", "vaupes", "vichada",
]

[vocabulario]
# Profesiones ajenas a cualquiera de nuestras carreras. Se miran SOLO en el
# título, nunca en la descripción: un ingeniero de procesos en una clínica sigue
# siendo ingeniero de procesos, pero un "Auxiliar de Enfermería" no es para
# nuestros egresados aunque el aviso también nombre seguridad y salud en el
# trabajo. Salió del boletín del 22/09/2026, donde la profesora encontró
# justamente esa vacante.
#
# Cada carrera define el resto de su vocabulario en su propio archivo.
excluidos_titulo = [
  "enfermeria", "enfermero", "auxiliar de enfermeria",
  "regente de farmacia", "quimico farmaceutico", "farmaceuta",
  "odontologia", "odontologica", "odontologico", "odontologo",
  "medico", "medicina", "quimica farmaceutica",
  "bacteriologo", "fisioterapeuta", "terapeuta", "nutricionista",
  "psicologo", "trabajador social", "veterinario",
  "abogado", "contador publico", "revisor fiscal",
  "docente", "profesor",
]
