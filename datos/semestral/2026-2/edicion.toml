[[secciones]]
tipo = "texto"
etiqueta = "Planeta"
titulo = "Nuestro compromiso con el *planeta*"
cuerpo = """
Estudiantes de Ingeniería Industrial e Ingeniería de Software participaron en la **VII jornada institucional de siembra de árboles**.

El programa **Ecohumboldt** fue seleccionado por el Ministerio de Educación y el IDEAM como una de las **20 experiencias significativas** en empoderamiento para la acción climática. Es un reconocimiento a la trayectoria de proyectos como Ecohumboldt en tu colegio, el apoyo a las asociaciones de recicladores y el semillero de proyección social.

Ecohumboldt ocupó además el **segundo lugar** en la categoría Aulas que cuidan del premio Bibo de El Espectador, entre las universidades participantes.

Siguen en ejecución los talleres de huella de carbono con los estudiantes de primer semestre, en la asignatura Cátedra Alexander von Humboldt.

En articulación con la empresa Urbaser se prepara la conferencia «Más allá de los residuos», en la que empresarios del departamento podrán descubrir oportunidades dentro de su cadena de abastecimiento para mejorar sus prácticas ambientales y tener modelos productivos más sostenibles.
"""
fotos = [
  { archivo = "taller-huella-carbono.jpg", pie = "Taller de huella de carbono en la Cátedra Alexander von Humboldt" },
  { archivo = "ecohumboldt-experiencias-significativas.jpg", pie = "Ecohumboldt entre las 20 experiencias significativas (MinEducación e IDEAM)" },
  { archivo = "premio-bibo.jpg", pie = "Reconocimiento Bibo 2026 de El Espectador" },
]

[[secciones]]
tipo = "texto"
etiqueta = "Emprendimiento"
titulo = "Ruta de *emprendimiento*"
cuerpo = """
A través de la ruta de emprendimiento se acompañaron **4 emprendimientos** de estudiantes de diferentes facultades, mientras continúan las charlas de sensibilización y de fomento al emprendimiento.

Junto con la Facultad de Ciencias Administrativas se celebró el **Encuentro de Cultura Emprendedora**, con una jornada académica y otra de exposiciones. Nuestras emprendedoras, la docente Diana Melo y la coordinadora del programa de Ingeniería Industrial y Civil fueron ganadoras del **premio Humboldt Emprende**.

También se participó en la lúdica «Construye tu ciudad inteligente» en el Colegio CASD, en articulación con la Facultad de Ciencias Administrativas.
"""
fotos = [
  { archivo = "encuentro-cultura-emprendedora.jpg", pie = "Encuentro de Cultura Emprendedora" },
  { archivo = "ludica-casd.jpg", pie = "Lúdica «Construye tu ciudad inteligente» en el Colegio CASD" },
  { archivo = "charla-emprendimiento.jpg", pie = "Charla «No necesitas empezar de cero»" },
]

